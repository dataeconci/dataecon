{% extends "layout.html" %}

{% block title %}Nouveau mot de passe - DataEcon.Ci{% endblock %}

{% block content %}
<div class="newpwd-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-5">
            <div class="col-lg-5 col-md-7">
                <div class="newpwd-card">
                    <div class="newpwd-card-header">
                        <div class="newpwd-icon">🔐</div>
                        <h2>Nouveau mot de passe</h2>
                        <p>Choisissez un nouveau mot de passe sécurisé</p>
                    </div>

                    <div class="newpwd-card-body">
                        <form method="POST" class="needs-validation" novalidate>
                            <div class="form-group-modern">
                                <label for="password">
                                    <i class="fas fa-lock"></i> Nouveau mot de passe
                                </label>
                                <div class="password-input-wrapper">
                                    <input type="password" 
                                           class="form-control form-control-modern" 
                                           id="password" 
                                           name="password" 
                                           placeholder="••••••••"
                                           minlength="6"
                                           required
                                           autofocus>
                                    <button type="button" 
                                            class="password-toggle" 
                                            onclick="togglePassword('password')">
                                        <i class="fas fa-eye" id="password-icon"></i>
                                    </button>
                                </div>
                                <div class="form-hint">
                                    Minimum 6 caractères avec lettres et chiffres.
                                </div>
                            </div>

                            <div class="form-group-modern">
                                <label for="password_confirm">
                                    <i class="fas fa-check-circle"></i> Confirmer le mot de passe
                                </label>
                                <div class="password-input-wrapper">
                                    <input type="password" 
                                           class="form-control form-control-modern" 
                                           id="password_confirm" 
                                           name="password_confirm" 
                                           placeholder="••••••••"
                                           required>
                                    <button type="button" 
                                            class="password-toggle" 
                                            onclick="togglePassword('password_confirm')">
                                        <i class="fas fa-eye" id="password_confirm-icon"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Indicateur de force du mot de passe -->
                            <div class="password-strength">
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strength-fill"></div>
                                </div>
                                <span class="strength-text" id="strength-text"></span>
                            </div>

                            <button type="submit" class="btn-newpwd">
                                <i class="fas fa-save"></i> Enregistrer le nouveau mot de passe
                            </button>

                            <div class="newpwd-links">
                                <a href="{{ url_for('login') }}">
                                    <i class="fas fa-arrow-left"></i> Retour à la connexion
                                </a>
                            </div>
                        </form>
                    </div>

                    <div class="newpwd-card-footer">
                        <span><i class="fas fa-shield-alt"></i> Mot de passe crypté</span>
                        <span><i class="fas fa-check-circle"></i> Sécurisé</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.newpwd-page {
    background: linear-gradient(135deg, #1a2a6c 0%, #2d3561 50%, #4a4a8a 100%);
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

.newpwd-page::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: rgba(253, 187, 45, 0.08);
    border-radius: 50%;
    animation: float 20s ease-in-out infinite;
}

.newpwd-card {
    background: white;
    border-radius: 25px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    animation: slideUp 0.6s ease;
    position: relative;
    z-index: 1;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
}

.newpwd-card-header {
    background: linear-gradient(135deg, #1a2a6c 0%, #2d3561 100%);
    color: white;
    padding: 40px 35px 30px;
    text-align: center;
}

.newpwd-icon {
    font-size: 4rem;
    margin-bottom: 15px;
}

.newpwd-card-header h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 10px;
}

.newpwd-card-header p {
    margin: 0;
    opacity: 0.85;
    font-size: 0.95rem;
}

.newpwd-card-body {
    padding: 40px 35px;
}

.form-group-modern {
    margin-bottom: 22px;
}

.form-group-modern label {
    display: block;
    color: #2d3436;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95rem;
}

.form-group-modern label i {
    color: #1a2a6c;
    margin-right: 6px;
}

.form-control-modern {
    border: 2px solid #e8eaf0;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: #f8f9fc;
    width: 100%;
}

.form-control-modern:focus {
    border-color: #1a2a6c;
    background: white;
    box-shadow: 0 0 0 4px rgba(26, 42, 108, 0.1);
    outline: none;
}

.form-hint {
    display: block;
    margin-top: 6px;
    font-size: 0.82rem;
    color: #7a8aaa;
}

.password-input-wrapper {
    position: relative;
}

.password-input-wrapper input {
    padding-right: 50px;
}

.password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #7a8aaa;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 8px;
    transition: all 0.2s;
}

.password-toggle:hover {
    background: #e8eaf0;
    color: #1a2a6c;
}

.password-strength {
    margin-bottom: 25px;
}

.strength-bar {
    height: 6px;
    background: #e8eaf0;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
}

.strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    transition: all 0.3s ease;
}

.strength-text {
    font-size: 0.8rem;
    font-weight: 600;
}

.btn-newpwd {
    width: 100%;
    background: linear-gradient(135deg, #1a2a6c 0%, #2d3561 100%);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 20px;
}

.btn-newpwd:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(26, 42, 108, 0.4);
}

.btn-newpwd i {
    margin-right: 8px;
}

.newpwd-links {
    text-align: center;
    font-size: 0.9rem;
}

.newpwd-links a {
    color: #1a2a6c;
    font-weight: 600;
    text-decoration: none;
}

.newpwd-card-footer {
    background: #f8f9fc;
    padding: 18px 35px;
    border-top: 1px solid #e8eaf0;
    display: flex;
    justify-content: center;
    gap: 25px;
    font-size: 0.85rem;
    color: #7a8aaa;
}

.newpwd-card-footer span i {
    color: #28a745;
    margin-right: 5px;
}
</style>

<script>
function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(fieldId + '-icon');
    
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const password = document.getElementById('password');
    const strengthFill = document.getElementById('strength-fill');
    const strengthText = document.getElementById('strength-text');
    
    if (password) {
        password.addEventListener('input', function() {
            const val = this.value;
            let strength = 0;
            
            if (val.length >= 6) strength++;
            if (val.length >= 10) strength++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^a-zA-Z0-9]/.test(val)) strength++;
            
            const percent = (strength / 5) * 100;
            strengthFill.style.width = percent + '%';
            
            if (strength <= 2) {
                strengthFill.style.background = '#dc3545';
                strengthText.textContent = 'Faible';
                strengthText.style.color = '#dc3545';
            } else if (strength <= 3) {
                strengthFill.style.background = '#ffc107';
                strengthText.textContent = 'Moyen';
                strengthText.style.color = '#ffc107';
            } else {
                strengthFill.style.background = '#28a745';
                strengthText.textContent = 'Fort';
                strengthText.style.color = '#28a745';
            }
        });
    }
});
</script>
{% endblock %}
