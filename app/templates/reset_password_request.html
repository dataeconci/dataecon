{% extends "layout.html" %}

{% block title %}Réinitialisation du mot de passe - DataEcon.Ci{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-lg">
                <div class="card-header text-center">
                    <h3 class="mb-0">
                        <i class="fas fa-key"></i> Réinitialiser le mot de passe
                    </h3>
                    <p class="text-white-50 small mt-1">Entrez votre email pour recevoir un lien</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i> Email
                            </label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="exemple@email.com" required>
                            <div class="invalid-feedback">Veuillez entrer votre email.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane"></i> Envoyer le lien
                        </button>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('login') }}" class="text-decoration-none small">
                                <i class="fas fa-arrow-left"></i> Retour à la connexion
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
