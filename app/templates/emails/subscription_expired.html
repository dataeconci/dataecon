<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Abonnement expiré</title></head>
<body>
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; font-family: Arial, sans-serif; background: #f4f6f9; border-radius: 10px;">
        <div style="background: #6c757d; padding: 20px; text-align: center; border-radius: 10px 10px 0 0;">
            <h1 style="color: white; margin: 0;">📊 DataEcon.Ci</h1>
        </div>
        <div style="background: white; padding: 30px; border-radius: 0 0 10px 10px;">
            <h2 style="color: #1a2a6c;">Bonjour {{ user.first_name }},</h2>
            <p>Votre abonnement a expiré et votre compte est repassé en formule <strong>Gratuite</strong>.</p>
            <p>Vous pouvez vous réabonner à tout moment pour retrouver l'accès complet :</p>
            <div style="text-align: center; margin: 30px 0;">
                <a href="{{ subscription_url }}" style="background: #1a2a6c; color: white; padding: 14px 40px; text-decoration: none; border-radius: 50px; display: inline-block;">
                    Me réabonner
                </a>
            </div>
        </div>
    </div>
</body>
</html>
