{% extends "layout.html" %}

{% block title %}Nouveau mot de passe - DataEcon.Ci{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-lg">
                <div class="card-header text-center">
                    <h3 class="mb-0">
                        <i class="fas fa-lock"></i> Nouveau mot de passe
                    </h3>
                </div>
                <div class="card-body p-4">
                    <form method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Nouveau mot de passe
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" minlength="6" required>
                            <div class="invalid-feedback">Le mot de passe doit faire au moins 6 caractères.</div>
                        </div>
                        <div class="mb-3">
                            <label for="password_confirm" class="form-label">
                                <i class="fas fa-check-circle"></i> Confirmer
                            </label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" placeholder="••••••••" required>
                            <div class="invalid-feedback">Les mots de passe ne correspondent pas.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save"></i> Mettre à jour
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
