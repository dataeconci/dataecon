# Nginx devant gunicorn : fichiers statiques, compression, limitation de debit
worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 500m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    limit_req_zone $binary_remote_addr zone=general:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream dataecon_app {
        server web:10000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;

        location /static/ {
            alias /usr/share/nginx/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        location ~ ^/(login|register|forgot|reset) {
            limit_req zone=auth burst=15 nodelay;
            include /etc/nginx/proxy_params_dataecon;
            proxy_pass http://dataecon_app;
        }

        location / {
            limit_req zone=general burst=120 nodelay;
            limit_conn perip 100;
            include /etc/nginx/proxy_params_dataecon;
            proxy_pass http://dataecon_app;
        }
    }
}
